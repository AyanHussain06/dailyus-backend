<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyUs</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div id="app">

  <!-- AUTH SCREEN -->
  <section id="auth-screen" class="screen active">
    <div class="auth-card">
      <h1>💛 DailyUs</h1>
      <p class="subtitle">One photo a day, just for the two of you.</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Log in</button>
        <button class="tab-btn" data-tab="signup">Sign up</button>
      </div>

      <form id="login-form" class="auth-form active">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Log in</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="signup-form" class="auth-form">
        <input type="text" id="signup-name" placeholder="Your name" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password (min 8 chars)" required>
        <button type="submit">Create account</button>
        <p class="error" id="signup-error"></p>
      </form>
    </div>
  </section>

  <!-- PAIRING SCREEN -->
  <section id="pairing-screen" class="screen">
    <div class="auth-card">
      <h1>Pair up 💞</h1>
      <p class="subtitle">Link with your partner to start your shared timeline.</p>

      <div class="pair-option">
        <h3>Have a code?</h3>
        <form id="join-form">
          <input type="text" id="join-code" placeholder="Enter invite code" maxlength="6" required>
          <button type="submit">Join</button>
        </form>
        <p class="error" id="join-error"></p>
      </div>

      <div class="divider">or</div>

      <div class="pair-option">
        <h3>Invite your partner</h3>
        <button id="create-invite-btn">Generate invite code</button>
        <div id="invite-result" class="invite-result hidden">
          <p>Share this code (valid 24h):</p>
          <div class="invite-code" id="invite-code-display"></div>
          <p class="hint">Waiting for them to join...</p>
        </div>
      </div>

      <button id="logout-from-pairing" class="link-btn">Log out</button>
    </div>
  </section>

  <!-- MAIN APP -->
  <section id="main-screen" class="screen">
    <header class="top-bar">
      <h2>💛 DailyUs</h2>
      <div class="streak-badge" id="streak-badge">🔥 0 day streak</div>
      <button id="logout-btn" class="icon-btn">Log out</button>
    </header>

    <nav class="tab-nav">
      <button class="nav-btn active" data-view="timeline-view">Timeline</button>
      <button class="nav-btn" data-view="chat-view">Chat</button>
      <button class="nav-btn" data-view="collage-view">Collage</button>
    </nav>

    <!-- TIMELINE VIEW -->
    <div id="timeline-view" class="view active">
      <div class="upload-card">
        <label class="upload-label" for="photo-input">📷 Upload today's photo</label>
        <input type="file" id="photo-input" accept="image/*" hidden>
        <input type="text" id="caption-input" placeholder="Add a caption (optional)" maxlength="280">
        <button id="upload-btn">Upload</button>
        <p class="hint" id="upload-status"></p>
      </div>

      <div id="timeline-grid" class="timeline-grid"></div>
    </div>

    <!-- CHAT VIEW -->
    <div id="chat-view" class="view">
      <div id="messages-list" class="messages-list"></div>
      <form id="message-form" class="message-form">
        <input type="text" id="message-input" placeholder="Say something sweet..." autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- COLLAGE VIEW -->
    <div id="collage-view" class="view">
      <div class="collage-controls">
        <label for="collage-days">Photos from the last</label>
        <select id="collage-days">
          <option value="7">7 days</option>
          <option value="14">14 days</option>
          <option value="30">30 days</option>
        </select>
        <button id="generate-collage-btn">Generate collage</button>
      </div>
      <div id="collage-result" class="collage-result"></div>
    </div>
  </section>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
